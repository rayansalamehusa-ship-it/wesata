<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>دخول المكتب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="login">
  <div class="panel">
    <h1>◆ دخول المكتب</h1>
    <p style="color:var(--muted);text-align:center;margin:4px 0 18px">هذه الصفحة للوسطاء المعتمدين فقط.</p>
    <label class="f" for="lu">اسم المستخدم</label>
    <input id="lu" autocomplete="username" autofocus>
    <label class="f" for="lp">كلمة المرور</label>
    <input id="lp" type="password" autocomplete="current-password">
    <button class="btn" id="go" style="width:100%">دخول</button>
    <p style="text-align:center;margin:16px 0 0"><a href="/" style="color:var(--muted)">العودة إلى الموقع</a></p>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="login.js"></script>
</body>
</html>
